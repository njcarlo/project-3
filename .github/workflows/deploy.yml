name: Deploy to Firebase App Hosting

# Every push to main (i.e. every merged PR) triggers an App Hosting rollout
# that builds and deploys that exact commit. Can also be run manually from the
# Actions tab via "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping rollouts if several merges land close together — cancel an
# in-progress deploy when a newer commit arrives.
concurrency:
  group: app-hosting-deploy
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREBASE_PROJECT_ID: mezastar-collector
      # Set this repository variable to your App Hosting backend ID
      # (Settings > Secrets and variables > Actions > Variables).
      BACKEND_ID: ${{ vars.APP_HOSTING_BACKEND_ID }}
    steps:
      - name: Check required config
        run: |
          if [ -z "$BACKEND_ID" ]; then
            echo "::error::Repository variable APP_HOSTING_BACKEND_ID is not set." \
                 "Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is not set." \
                 "Add the service-account JSON under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Create App Hosting rollout for this commit
        run: |
          firebase apphosting:rollouts:create "$BACKEND_ID" \
            --project "$FIREBASE_PROJECT_ID" \
            --git-commit "$GITHUB_SHA" \
            --force
