name: Deploy Firebase Hosting

# Deploys the Firebase Hosting site, which rewrites all traffic to the App
# Hosting backend so the short mezastar-collector.web.app domain serves the app.
# Runs on manual dispatch, and on pushes that touch the hosting config.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - firebase.json
      - .hosting-public/**
      - .github/workflows/deploy-hosting.yml

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREBASE_PROJECT_ID: mezastar-collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is not set."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting
        run: |
          firebase deploy --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
